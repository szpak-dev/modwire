[build-system]
requires = ["setuptools>=77", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modwire-cli"
dynamic = ["version"]
description = "Command-line interface for the Modwire ecosystem."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Tomasz Szpak" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
keywords = ["cli", "modwire"]
dependencies = [
    "modwire-architecture>=7,<8",
    "modwire-extraction>=2,<3",
    "pydantic-yaml>=1.7",
    "rich>=13",
    "wireup>=2.12.0",
]

[project.scripts]
modwire = "modwire_cli.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.3",
    "pytest>=9",
    "ruff>=0.14",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/modwire/modwire-cli"
Repository = "https://github.com/modwire/modwire-cli"
Issues = "https://github.com/modwire/modwire-cli/issues"

[dependency-groups]
dev = [
    "build>=1.3",
    "pytest>=9",
    "ruff>=0.14",
    "twine>=6",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"modwire_cli" = ["py.typed", "resources/init/*"]

[tool.setuptools_scm]
tag_regex = '^v(?P<version>\d+\.\d+\.\d+)$'
fallback_version = "0.0.0.dev0"
local_scheme = "no-local-version"
version_file = "src/modwire_cli/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
extend-exclude = ["**/_version.py"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
