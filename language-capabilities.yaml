        limitation_scenarios: []
      parameters:
        status: supported
        explanation: Callable parameter order, kind, annotation, and default presence
          are extracted.
        limitation_scenarios: []
      annotations:
        status: partial
        explanation: Class and callable decorators and declared type annotations are
          extracted; arbitrary annotations are not evaluated.
        limitation_scenarios:
        - annotation-evaluation-boundary
      modifiers:
        status: partial
        explanation: Visibility intent, callable kind, and class property member kind
          are normalized.
        limitation_scenarios:
        - modifier-normalization-boundary
      attributes:
        status: supported
        explanation: Class property identity, exact declared type, visibility, optionality,
          and member kind are extracted.
        limitation_scenarios: []
      assigned_values:
        status: supported
        explanation: Ordered assignment evidence distinguishes calls, references,
          literals, unresolved expressions, and declarations without an assigned value.
        limitation_scenarios: []
      inheritance:
        status: supported
        explanation: Every declared Python base expression is recorded.
        limitation_scenarios: []
      namespaces:
        status: unsupported
        explanation: Python namespace declarations are not extracted yet.
        limitation_scenarios:
        - package-namespace
      declaration_kinds:
        status: supported
        explanation: Classes and abstract classes publish exact shared declaration
          kinds.
        limitation_scenarios: []
      composition:
        status: unsupported
        explanation: Python base expressions are reported as inheritance; no distinct
          composition relation syntax is classified.
        limitation_scenarios:
        - no-distinct-composition-syntax
      dependencies:
        status: supported
        explanation: Imports are normalized and resolved when targets are present.
        limitation_scenarios: []
      spans:
        status: partial
        explanation: Callable spans are exact; other symbol facts expose line counts.
        limitation_scenarios:
        - non-callable-span-boundary
    relationships:
      declaration:
        semantics: partial
        semantics_explanation: Authored base expressions are preserved without interpreting
          runtime rebinding, metaclasses, or framework conventions.
        semantics_limitation_scenarios:
        - declaration-runtime-semantics-boundary
        inventory: supported
