      source: src/example_package/__init__.py
      authored_syntax:
      - ExampleAlias = ExampleBase
    - scenario: member-runtime-semantics-boundary
      rationale: Runtime member mutation does not fabricate a declared class attribute.
      source: src/example_package/__init__.py
      authored_syntax:
      - ExampleBase.example_runtime_member
