name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - run: uv sync --all-groups --locked
      - run: make package-check
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: .dev/dist/

  publish-github-assets:
    name: Attach distributions to GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: .dev/dist/
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .dev/dist/* --clobber --repo "${{ github.repository }}"

  publish-pypi:
    name: Publish distributions to PyPI
    needs: [build, publish-github-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/modwire/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: .dev/dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: .dev/dist/
          skip-existing: true
