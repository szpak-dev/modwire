name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contract:
    name: Language runtime contract
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.contract.outputs.contract }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install uv
      - run: uv sync --all-groups --locked
      - id: contract
        run: uv run python -m scripts.language_runtime_contract "$GITHUB_OUTPUT"

  package:
    name: Package on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: runtime-contract
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).typescript.version }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).java.version }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).php.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).ruby.version }}
      - run: >-
          gem install
          "${{ fromJSON(needs.runtime-contract.outputs.contract).ruby.packages[0].name }}"
          --version "${{ fromJSON(needs.runtime-contract.outputs.contract).ruby.packages[0].version }}"
          --no-document
      - run: python -m pip install uv
      - run: uv sync --all-groups --locked
      - run: make host-check

  extractors:
    name: Extractor resources
    runs-on: ubuntu-latest
    needs: runtime-contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).python.version }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).typescript.version }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).java.version }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).php.version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ fromJSON(needs.runtime-contract.outputs.contract).ruby.version }}
      - run: >-
          gem install
          "${{ fromJSON(needs.runtime-contract.outputs.contract).ruby.packages[0].name }}"
          --version "${{ fromJSON(needs.runtime-contract.outputs.contract).ruby.packages[0].version }}"
          --no-document
      - run: python -m pip install uv
      - run: uv sync --all-groups --locked
      - run: make extractor-check
