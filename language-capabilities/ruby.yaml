scenarios:
- scenario: runtime-generated-symbol
  rationale: Runtime class construction remains a constant value and does not fabricate a class declaration.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - ExampleGenerated = Class.new
- scenario: generated-callable
  rationale: A generated method is not fabricated as a statically declared callable.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - define_method(:example_generated_method)
- scenario: dynamic-call-resolution
  rationale: Static, missing, and receiver-driven calls retain distinct resolution evidence while calls inside
    a generated method remain absent.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - example_receiver.public_send
  - example_generated_call
- scenario: generated-callable-parameters
  rationale: Parameters of declared methods are normalized while a generated method parameter is not
    fabricated.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - example_generated_parameter
- scenario: annotation-dsl
  rationale: Annotation DSL calls do not fabricate shared annotation facts.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - sig { params
- scenario: singleton-visibility
  rationale: Declared callable kinds and ordinary visibility are normalized without interpreting singleton
    visibility mutation.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - private_class_method :example_hidden
- scenario: generated-attributes
  rationale: Reader declarations and instance-variable assignments do not fabricate shared attribute or
    assigned-value facts.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - attr_reader :example_generated_attribute
  - '@example_generated_attribute = example_value'
- scenario: dynamic-namespace
  rationale: Runtime module construction does not fabricate a statically declared namespace.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - ExampleDynamicNamespace = Module.new
- scenario: dynamic-composition
  rationale: Literal declaration-body composition is emitted while runtime composition is not fabricated.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - ExampleRuntime.include(ExampleIncluded)
- scenario: dynamic-dependency
  rationale: A literal load is emitted while a runtime-computed load is not fabricated.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - require example_dependency
- scenario: non-callable-span-boundary
  rationale: Callable spans are exact while class declarations have no exact-span identity.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - class ExampleBase
- scenario: runtime-superclass-semantics
  rationale: The authored superclass alias is retained without resolving its runtime target.
  source: tests/fixtures/code_map/capability_gaps/ruby/src/example_capability_gaps.rb
  authored_syntax:
  - class ExampleRuntime < ExampleRuntimeBase
