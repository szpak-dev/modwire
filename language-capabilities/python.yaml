scenarios:
  - scenario: annotation-evaluation-boundary
    rationale: Annotation syntax is preserved without executing its runtime mutation.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - '@example_annotation'
      - example_runtime_annotation
  - scenario: modifier-normalization-boundary
    rationale: The final decorator is preserved without inventing a shared modifier value.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - '@final'
  - scenario: package-namespace
    rationale: Package layout is scanned but no namespace fact is emitted.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - EXAMPLE_PACKAGE_VALUE
  - scenario: no-distinct-composition-syntax
    rationale: Python bases emit inheritance without a fabricated composition relation.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - class ExampleRuntime(ExampleAlias)
  - scenario: non-callable-span-boundary
    rationale: Callable spans are exact while class declarations have no exact-span identity.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - class ExampleBase
  - scenario: declaration-runtime-semantics-boundary
    rationale: The authored alias is retained without interpreting its runtime target.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - ExampleAlias = ExampleBase
  - scenario: member-runtime-semantics-boundary
    rationale: Runtime member mutation does not fabricate a declared class attribute.
    source: tests/fixtures/code_map/capability_gaps/python/src/example_package/__init__.py
    authored_syntax:
      - ExampleBase.example_runtime_member
  - scenario: type-reference-grammar-boundary
    rationale: Named generic references are structural while union syntax is explicitly unsupported.
    source: tests/fixtures/code_map/type_references/python/src/type_reference_cases.py
    authored_syntax:
      - list[str]
      - str | None
