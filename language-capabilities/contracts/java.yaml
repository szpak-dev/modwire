language: java
runtime:
  runtime: java
  probe:
    arguments: [--version]
    pattern: ^(?:openjdk|java) (?:version )?"?(\d+\.\d+\.\d+)
  version:
    major: 25
    minor: 0
    patch: 2
  packages: []
fixtures:
  source_suffixes:
  - .java
  extensions:
    root: tests/fixtures/code_map/language_extensions/java
    sources:
    - src/ExampleShapes.java
  gaps:
    root: tests/fixtures/code_map/capability_gaps/java
    sources:
    - src/ExampleCapabilityGaps.java
  types:
    root: tests/fixtures/code_map/type_references/java
    sources:
    - src/TypeReferenceCases.java
    - src/TypeReferenceEmpty.java
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/java
    sources:
    - src/Params.java
  structural:
    root: tests/fixtures/structural_fidelity
    sources:
    - java/src/Example.java
capabilities:
  sources:
    status: supported
  symbols:
    status: supported
  callables:
    status: supported
  calls:
    status: supported
  parameters:
    status: supported
  type_references:
    status: partial
  annotations:
    status: partial
  modifiers:
    status: partial
  attributes:
    status: supported
  assigned_values:
    status: unsupported
  inheritance:
    status: supported
  namespaces:
    status: supported
  declaration_kinds:
    status: supported
  composition:
    status: partial
  dependencies:
    status: partial
  spans:
    status: partial
relationships:
  declaration:
    semantics: partial
    inventory: partial
  member:
    semantics: partial
    inventory: partial
  dependency:
    semantics: partial
    inventory: partial
scenarios:
- name: supported-contract
  fixture: extensions
  source: src/ExampleShapes.java
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: source, relative_path: src/ExampleShapes.java}
  - kind: capability
    capability: symbols
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: example.shapes.ExampleRecord, declaration_kind: record}
  - kind: capability
    capability: callables
    evidence: supported
    state: present
    observation: {kind: callable, qualified_name: example.shapes.ExampleContract.exampleRequired,
        callable_kind: instance_method}
  - kind: capability
    capability: calls
    evidence: supported
    state: present
    observation: {kind: call, owner: example.shapes.ExampleImplementation.exampleTimestamp, target:
        exampleRequired, resolution: resolved}
  - kind: capability
    capability: namespaces
    evidence: supported
    state: present
    observation: {kind: namespace, qualified_name: example.shapes, namespace_kind: package}
  - kind: capability
    capability: declaration_kinds
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: example.shapes.ExampleAnnotation, declaration_kind:
        annotation}
  - kind: capability
    capability: modifiers
    evidence: supported
    state: present
    observation: {kind: modifier, owner: example.shapes.ExampleImplementation.exampleRequired, visibility:
        public}
  - kind: relationship
    relationship: dependency
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/ExampleShapes.java, target: java.time.Instant, resolution:
        external}
  - kind: relationship
    relationship: dependency
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/ExampleShapes.java, target: java.time.Instant, resolution:
        external}
- name: empty-source
  fixture: types
  source: src/TypeReferenceEmpty.java
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: empty_source, relative_path: src/TypeReferenceEmpty.java}
- name: annotation-evaluation-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: annotations
    evidence: supported
    state: present
    observation: {kind: annotation, owner: example.capability.gaps.ExampleBase, expression: '@ExampleMarker(exampleValue
        = "exampleRuntimeAnnotation")'}
  - kind: capability
    capability: annotations
    evidence: boundary
    state: absent
    observation: {kind: annotation, owner: example.capability.gaps.ExampleBase, expression:
        exampleRuntimeAnnotation}
- name: modifier-normalization-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: modifiers
    evidence: boundary
    state: present
    observation: {kind: modifier, owner: example.capability.gaps.ExampleBase.exampleValue, visibility:
        internal}
- name: assigned-value
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: assigned_values
    evidence: boundary
    state: present
    observation:
      kind: assigned_values
      owner: example.capability.gaps.ExampleBase
  - kind: capability
    capability: attributes
    evidence: supported
    state: present
    observation: {kind: attribute, owner: example.capability.gaps.ExampleMarker, name: exampleValue,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: attribute, owner: example.capability.gaps.ExampleMarker, name: exampleValue,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: inventory
    evidence: boundary
    state: present
    observation:
      kind: assigned_values
      owner: example.capability.gaps.ExampleBase
- name: permits-relation
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: composition
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleChild, relation: extends,
        target: ExampleBase}
  - kind: capability
    capability: composition
    evidence: boundary
    state: absent
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleBase, relation: extends,
        target: ExampleChild}
  - kind: capability
    capability: inheritance
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleChild, relation: extends,
        target: ExampleBase}
  - kind: capability
    capability: inheritance
    evidence: boundary
    state: absent
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleBase, relation: extends,
        target: ExampleChild}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleChild, relation: extends,
        target: ExampleBase}
  - kind: relationship
    relationship: declaration
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleChild, relation: extends,
        target: ExampleBase}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: boundary
    state: absent
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleBase, relation: extends,
        target: ExampleChild}
  - kind: relationship
    relationship: declaration
    aspect: inventory
    evidence: boundary
    state: absent
    observation: {kind: declaration_relation, source: example.capability.gaps.ExampleBase, relation: extends,
        target: ExampleChild}
- name: dependency-resolution-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: dependencies
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/ExampleCapabilityGaps.java, target: java.util.*, resolution:
        external}
  - kind: capability
    capability: dependencies
    evidence: boundary
    state: absent
    observation: {kind: dependency, source: src/ExampleCapabilityGaps.java, target: java.util.*, resolution:
        resolved}
  - kind: relationship
    relationship: dependency
    aspect: semantics
    evidence: boundary
    state: present
    observation: {kind: dependency, source: src/ExampleCapabilityGaps.java, target: java.util.*, resolution:
        external}
  - kind: relationship
    relationship: dependency
    aspect: inventory
    evidence: boundary
    state: present
    observation: {kind: dependency, source: src/ExampleCapabilityGaps.java, target: java.util.*, resolution:
        external}
- name: non-callable-span-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: spans
    evidence: supported
    state: present
    observation: {kind: exact_span, owner: example.capability.gaps.ExampleBase.exampleMethod, start: 13, end:
        13}
  - kind: capability
    capability: spans
    evidence: boundary
    state: absent
    observation: {kind: span_owner, owner: example.capability.gaps.ExampleBase}
- name: member-runtime-semantics-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.java
  claims:
  - kind: capability
    capability: attributes
    evidence: boundary
    state: absent
    observation: {kind: attribute, owner: example.capability.gaps.ExampleBase, name: exampleRuntimeAnnotation,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: attribute, owner: example.capability.gaps.ExampleMarker, name: exampleValue,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: boundary
    state: absent
    observation: {kind: attribute, owner: example.capability.gaps.ExampleBase, name: exampleRuntimeAnnotation,
        member_kind: instance}
- name: type-reference-grammar-boundary
  fixture: types
  source: src/TypeReferenceCases.java
  claims:
  - kind: capability
    capability: type_references
    evidence: supported
    state: present
    observation:
      kind: type_reference
      owner: TypeReferenceCases.exampleTypes
      role: return
      position: 0
  - kind: capability
    capability: type_references
    evidence: boundary
    state: unsupported
    observation: {kind: type_slot, owner: TypeReferenceCases.exampleTypes, role: parameter, position: 1}
  - kind: capability
    capability: type_references
    evidence: boundary
    state: absent
    observation: {kind: type_slot, owner: TypeReferenceCases.constructor, role: return, position: 0}
- name: parameter-kinds
  fixture: parameters
  source: src/Params.java
  claims:
  - kind: capability
    capability: parameters
    evidence: supported
    state: present
    observation:
      kind: parameter_list
      owner: Params.exampleParameters
manifests:
  root: tests/fixtures/implementation_manifest/java
  scenarios:
  - name: canonical
    source: canonical/src/Example.java
    facts_digest: 40010fcea8daa2d97c6b5dc8b70f8ebfd2e5540343688079a847132d9501b70d
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.java}
    - state: present
      observation: {kind: namespace, qualified_name: example.manifest, namespace_kind: package}
    - state: present
      observation: {kind: symbol, qualified_name: example.manifest.ExampleAbstract, symbol_kind:
          abstract_class}
    - state: present
      observation: {kind: callable, qualified_name: example.manifest.ExampleImplementation.constructor,
          callable_kind: constructor}
    - state: present
      observation: {kind: parameter, owner: example.manifest.ExampleAbstract.exampleRequired, position: 0}
    - state: present
      observation: {kind: attribute, owner: example.manifest.ExampleImplementation, name: EXAMPLE_CONSTANT,
          member_kind: static}
    - state: present
      observation: {kind: call, owner: example.manifest.ExampleImplementation.exampleTimestamp, target: now,
          resolution: unresolved}
    - state: present
      observation: {kind: declaration_relation, source: example.manifest.ExampleImplementation, relation:
          extends, target: ExampleAbstract}
    - state: present
      observation: {kind: dependency, source: src/Example.java, target: java.time.Instant, resolution:
          external}
  - name: calls
    source: calls/src/Example.java
    facts_digest: b06ed603379abe1687e08a6f78694a66261f6b0200980209c6822ed642d4c055
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.java}
    - state: present
      observation: {kind: call, owner: Example.exampleSource, target: exampleTarget, resolution: resolved}
  - name: no_calls
    source: no_calls/src/Example.java
    facts_digest: e537bab685e30c6fcf39f3c2a67ab186991e5764930b3bcaf010fafa5801a848
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.java}
    - state: absent
      observation: {kind: call, owner: Example.exampleSource, target: exampleTarget, resolution: resolved}
  - name: negative_members
    source: negative_members/src/Example.java
    facts_digest: 9d9b66001c6d493b9a876c35b4e37465af102606cda9d066dec86ce6bffdcd29
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.java}
    - state: absent
      observation: {kind: symbol, qualified_name: example.manifest.ExampleAbstract, symbol_kind:
          abstract_class}
  - name: dependencies
    source: dependencies/src/Example.java
    facts_digest: b80055c0c17145a4670820ccaea55dce59b824cbe41d062a9c027ee7a402d155
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.java}
    - state: present
      observation: {kind: dependency, source: src/Example.java, target: java.util.List, resolution: external}
  - name: source_edit_before
    source: source_edit_before/src/nested/Example.java
    facts_digest: d0c14421c33ca667d2088dbc7627288ac7ebd882d4654188ed272107630bef40
    claims:
    - state: present
      observation: {kind: source, relative_path: src/nested/Example.java}
  - name: source_edit_after
    source: source_edit_after/src/Example.java
    facts_digest: 72640a123c98011fb6fc9e1d4784b7c746212bab8c07eee51379fe04c7feff21
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.java}
  transitions:
  - before: source_edit_before
    after: source_edit_after
    changes:
    - source_identity
    - implementation_identity
