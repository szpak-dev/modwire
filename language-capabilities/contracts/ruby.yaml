language: ruby
runtime:
  runtime: ruby
  probe:
    arguments: [--version]
    pattern: ^ruby (\d+\.\d+\.\d+)
  version:
    major: 4
    minor: 0
    patch: 7
  packages:
  - manager: gem
    name: prism
    version:
      major: 1
      minor: 9
      patch: 0
fixtures:
  source_suffixes:
  - .rb
  extensions:
    root: tests/fixtures/code_map/language_extensions/ruby
    sources:
    - src/example_shapes.rb
    - src/example_support.rb
  gaps:
    root: tests/fixtures/code_map/capability_gaps/ruby
    sources:
    - src/example_capability_gaps.rb
  types:
    root: tests/fixtures/code_map/type_references/ruby
    sources:
    - src/type_reference_cases.rb
    - src/type_reference_empty.rb
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/ruby
    sources:
    - src/params.rb
  structural:
    root: tests/fixtures/structural_fidelity
    sources:
    - ruby/src/example.rb
    - ruby_receivers/src/example.rb
capabilities:
  sources:
    status: supported
  symbols:
    status: partial
  callables:
    status: partial
  calls:
    status: partial
  parameters:
    status: partial
  type_references:
    status: supported
  annotations:
    status: unsupported
  modifiers:
    status: partial
  attributes:
    status: partial
  assigned_values:
    status: unsupported
  inheritance:
    status: supported
  namespaces:
    status: partial
  declaration_kinds:
    status: supported
  composition:
    status: partial
  dependencies:
    status: partial
  spans:
    status: partial
relationships:
  declaration:
    semantics: partial
    inventory: partial
  member:
    semantics: partial
    inventory: partial
  dependency:
    semantics: partial
    inventory: partial
