language: php
runtime:
  runtime: php
  probe:
    arguments: [--version]
    pattern: ^PHP (\d+\.\d+\.\d+)
  version:
    major: 8
    minor: 4
    patch: 8
  rejected_versions: []
  packages: []
fixtures:
  source_suffixes:
  - .php
  extensions:
    root: tests/fixtures/code_map/language_extensions/php
    sources:
    - src/ExampleShapes.php
  gaps:
    root: tests/fixtures/code_map/capability_gaps/php
    sources:
    - src/ExampleCapabilityGaps.php
  types:
    root: tests/fixtures/code_map/type_references/php
    sources:
    - src/TypeReferenceCases.php
    - src/TypeReferenceEmpty.php
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/php
    sources:
    - src/Params.php
  structural:
    root: tests/fixtures/structural_fidelity
    sources:
    - php/src/Example.php
capabilities:
  sources:
    status: supported
  symbols:
    status: supported
  callables:
    status: supported
  calls:
    status: supported
  parameters:
    status: supported
  type_references:
    status: partial
  annotations:
    status: partial
  modifiers:
    status: partial
  attributes:
    status: supported
  assigned_values:
    status: unsupported
  inheritance:
    status: supported
  namespaces:
    status: supported
  declaration_kinds:
    status: supported
  composition:
    status: partial
  dependencies:
    status: supported
  spans:
    status: partial
relationships:
  declaration:
    semantics: partial
    inventory: partial
  member:
    semantics: partial
    inventory: partial
  dependency:
    semantics: supported
    inventory: supported
scenarios:
- name: supported-contract
  fixture: extensions
  source: src/ExampleShapes.php
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: source, relative_path: src/ExampleShapes.php}
  - kind: capability
    capability: symbols
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: ExampleShapes.ExampleContract, declaration_kind:
        interface}
  - kind: capability
    capability: callables
    evidence: supported
    state: present
    observation: {kind: callable, qualified_name: ExampleShapes.exampleFunction, callable_kind: function}
  - kind: capability
    capability: calls
    evidence: supported
    state: present
    observation: {kind: call, owner: ExampleShapes.ExampleImplementation.exampleTimestamp, target:
        exampleRequired, resolution: resolved}
  - kind: capability
    capability: inheritance
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleShapes.ExampleImplementation, relation: extends,
        target: ExampleAbstract}
  - kind: capability
    capability: declaration_kinds
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: ExampleShapes.ExampleAbstract, declaration_kind:
        abstract_class}
  - kind: capability
    capability: dependencies
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/ExampleShapes.php, target: DateTimeImmutable, resolution:
        external}
  - kind: relationship
    relationship: dependency
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/ExampleShapes.php, target: DateTimeImmutable, resolution:
        external}
  - kind: relationship
    relationship: dependency
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/ExampleShapes.php, target: DateTimeImmutable, resolution:
        external}
  - kind: capability
    capability: modifiers
    evidence: supported
    state: present
    observation: {kind: modifier, owner: ExampleShapes.ExampleImplementation.exampleTimestamp, visibility:
        public}
  - kind: capability
    capability: composition
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleShapes.ExampleImplementation, relation: extends,
        target: ExampleAbstract}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleShapes.ExampleImplementation, relation: extends,
        target: ExampleAbstract}
  - kind: relationship
    relationship: declaration
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleShapes.ExampleImplementation, relation: extends,
        target: ExampleAbstract}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: call, owner: ExampleShapes.ExampleImplementation.exampleTimestamp, target:
        exampleRequired, resolution: resolved}
- name: empty-source
  fixture: types
  source: src/TypeReferenceEmpty.php
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: empty_source, relative_path: src/TypeReferenceEmpty.php}
- name: non-type-attribute-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: annotations
    evidence: supported
    state: present
    observation: {kind: annotation, owner: ExampleCapabilityGaps.ExampleConsumer, expression:
        ExampleTypeMarker}
  - kind: capability
    capability: annotations
    evidence: boundary
    state: absent
    observation: {kind: annotation, owner: ExampleCapabilityGaps.ExampleTrait.exampleTraitValue, expression:
        ExampleMethodMarker}
- name: modifier-normalization-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: modifiers
    evidence: boundary
    state: present
    observation: {kind: modifier, owner: ExampleCapabilityGaps.ExampleConsumer, visibility: public}
- name: assigned-value
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: assigned_values
    evidence: boundary
    state: present
    observation:
      kind: assigned_values
      owner: ExampleCapabilityGaps.ExampleConsumer
  - kind: capability
    capability: attributes
    evidence: supported
    state: present
    observation: {kind: attribute, owner: ExampleCapabilityGaps.ExampleConsumer, name: exampleValue,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: attribute, owner: ExampleCapabilityGaps.ExampleConsumer, name: exampleValue,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: inventory
    evidence: boundary
    state: present
    observation:
      kind: assigned_values
      owner: ExampleCapabilityGaps.ExampleConsumer
- name: namespace-declaration
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: namespaces
    evidence: supported
    state: present
    observation: {kind: namespace, qualified_name: ExampleCapabilityGaps, namespace_kind: namespace}
- name: trait-use
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: composition
    evidence: boundary
    state: present
    observation: {kind: declaration_relation, source: ExampleCapabilityGaps.ExampleConsumer, relation:
        uses_trait, target: ExampleTrait}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: boundary
    state: present
    observation: {kind: declaration_relation, source: ExampleCapabilityGaps.ExampleConsumer, relation:
        uses_trait, target: ExampleTrait}
  - kind: relationship
    relationship: declaration
    aspect: inventory
    evidence: boundary
    state: present
    observation: {kind: declaration_relation, source: ExampleCapabilityGaps.ExampleConsumer, relation:
        uses_trait, target: ExampleTrait}
- name: non-callable-span-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: spans
    evidence: supported
    state: present
    observation: {kind: exact_span, owner: ExampleCapabilityGaps.ExampleConsumer.exampleConsumerValue, start:
        26, end: 29}
  - kind: capability
    capability: spans
    evidence: boundary
    state: absent
    observation: {kind: span_owner, owner: ExampleCapabilityGaps.ExampleConsumer}
- name: member-runtime-semantics-boundary
  fixture: gaps
  source: src/ExampleCapabilityGaps.php
  claims:
  - kind: capability
    capability: attributes
    evidence: boundary
    state: absent
    observation: {kind: attribute, owner: ExampleCapabilityGaps.ExampleConsumer, name: exampleRuntimeMember,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: attribute, owner: ExampleCapabilityGaps.ExampleConsumer, name: exampleValue,
        member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: boundary
    state: absent
    observation: {kind: attribute, owner: ExampleCapabilityGaps.ExampleConsumer, name: exampleRuntimeMember,
        member_kind: instance}
- name: type-reference-grammar-boundary
  fixture: types
  source: src/TypeReferenceCases.php
  claims:
  - kind: capability
    capability: type_references
    evidence: supported
    state: present
    observation:
      kind: type_reference
      owner: exampleTypes
      role: return
      position: 0
  - kind: capability
    capability: type_references
    evidence: boundary
    state: unsupported
    observation: {kind: type_slot, owner: exampleTypes, role: parameter, position: 1}
  - kind: capability
    capability: type_references
    evidence: boundary
    state: absent
    observation: {kind: type_slot, owner: exampleTypes, role: parameter, position: 2}
- name: parameter-kinds
  fixture: parameters
  source: src/Params.php
  claims:
  - kind: capability
    capability: parameters
    evidence: supported
    state: present
    observation:
      kind: parameter_list
      owner: exampleParameters
manifests:
  root: tests/fixtures/implementation_manifest/php
  scenarios:
  - name: canonical
    source: canonical/src/Example.php
    facts_digest: 570bc5218847b032b6d116b2560efab3243153405e0f9935ce2d5fc64906c218
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.php}
    - state: present
      observation: {kind: symbol, qualified_name: ExampleManifest.ExampleAbstract, symbol_kind: abstract_class}
    - state: present
      observation: {kind: callable, qualified_name: ExampleManifest.ExampleImplementation.__construct,
          callable_kind: constructor}
    - state: present
      observation: {kind: parameter, owner: ExampleManifest.exampleFunction, position: 0}
    - state: present
      observation: {kind: attribute, owner: ExampleManifest.ExampleImplementation, name: exampleOptional,
          member_kind: instance}
    - state: present
      observation: {kind: call, owner: ExampleManifest.ExampleImplementation.exampleTimestamp, target:
          exampleFormat, resolution: unresolved}
    - state: present
      observation: {kind: declaration_relation, source: ExampleManifest.ExampleImplementation, relation:
          extends, target: ExampleAbstract}
    - state: present
      observation: {kind: dependency, source: src/Example.php, target: DateTimeImmutable, resolution: external}
  - name: calls
    source: calls/src/Example.php
    facts_digest: 34ecd07e148d83612482954fed284d090931289eb3beeed1e43370b65d1e7639
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.php}
    - state: present
      observation: {kind: call, owner: exampleSource, target: exampleTarget, resolution: resolved}
  - name: no_calls
    source: no_calls/src/Example.php
    facts_digest: 108555b4144472c184b488a5152dc99d71eb09d103eaaec0206d122c7fcdab81
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.php}
    - state: absent
      observation: {kind: call, owner: exampleSource, target: exampleTarget, resolution: resolved}
  - name: negative_members
    source: negative_members/src/Example.php
    facts_digest: bcfdd196f148aa4ba13a7220c764e643dded41b3357c505dfa32622869c83774
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.php}
    - state: absent
      observation: {kind: symbol, qualified_name: src/Example.ExampleAbstract, symbol_kind: abstract_class}
  - name: dependencies
    source: dependencies/src/Example.php
    facts_digest: 439e82ffe3d0d0ddcb7510b3010d4286ecae6ba3aaec9a7a42909d7a7b79e332
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.php}
    - state: present
      observation: {kind: dependency, source: src/Example.php, target: DateTimeImmutable, resolution: external}
  - name: source_edit_before
    source: source_edit_before/src/nested/Example.php
    facts_digest: ecaf8654cf041073ee6578839aa793715c2ce8bddc1482f7460d673062f66842
    claims:
    - state: present
      observation: {kind: source, relative_path: src/nested/Example.php}
  - name: source_edit_after
    source: source_edit_after/src/Example.php
    facts_digest: 6934776e4954c09d432b53f79c13feaedc9cf9bb824ca71e4f68bd8dfd7a69f3
    claims:
    - state: present
      observation: {kind: source, relative_path: src/Example.php}
  transitions:
  - before: source_edit_before
    after: source_edit_after
    changes:
    - source_identity
    - implementation_identity
