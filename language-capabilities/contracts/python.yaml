language: python
runtime:
  runtime: python
  probe:
    arguments: [--version]
    pattern: ^Python (\d+\.\d+\.\d+)
  version:
    major: 3
    minor: 12
    patch: 11
  packages: []
fixtures:
  source_suffixes:
  - .py
  extensions:
    root: tests/fixtures/code_map/language_extensions/python
    sources:
    - src/example_shapes.py
  gaps:
    root: tests/fixtures/code_map/capability_gaps/python
    sources:
    - src/example_package/__init__.py
  types:
    root: tests/fixtures/code_map/type_references/python
    sources:
    - src/type_reference_cases.py
    - src/type_reference_empty.py
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/python
    sources:
    - src/params.py
capabilities:
  sources:
    status: supported
    explanation: Every included Python source is identified and hashed.
  symbols:
    status: supported
    explanation: Classes, abstract classes, functions, and values are extracted.
  callables:
    status: supported
    explanation: Functions, methods, constructors, and lambdas are extracted.
  calls:
    status: supported
    explanation: Static calls owned by extracted callables are emitted with explicit resolved, external,
      unresolved, or dynamic state.
  parameters:
    status: supported
    explanation: Callable parameter order, kind, annotation, and default presence are extracted.
  type_references:
    status: partial
    explanation: Named references and ordered generic arguments are structural; other authored type syntax is
      reported as unsupported.
  annotations:
    status: partial
    explanation: Class and callable decorators and declared type annotations are extracted; arbitrary annotations
      are not evaluated.
  modifiers:
    status: partial
    explanation: Visibility intent, callable kind, and class property member kind are normalized.
  attributes:
    status: supported
    explanation: Class property identity, exact declared type, visibility, optionality, and member kind are
      extracted.
  assigned_values:
    status: supported
    explanation: Ordered assignment evidence distinguishes calls, references, literals, unresolved expressions, and
      declarations without an assigned value.
  inheritance:
    status: supported
    explanation: Every declared Python base expression is recorded.
  namespaces:
    status: unsupported
    explanation: Python namespace declarations are not extracted yet.
  declaration_kinds:
    status: supported
    explanation: Classes and abstract classes publish exact shared declaration kinds.
  composition:
    status: unsupported
    explanation: Python base expressions are reported as inheritance; no distinct composition relation syntax is
      classified.
  dependencies:
    status: supported
    explanation: Imports are normalized and resolved when targets are present.
  spans:
    status: partial
    explanation: Callable spans are exact; other symbol facts expose line counts.
relationships:
  declaration:
    semantics: partial
    semantics_explanation: Authored base expressions are preserved without interpreting runtime rebinding,
      metaclasses, or framework conventions.
    inventory: supported
    inventory_explanation: Every authored class base expression in included Python sources is emitted
      deterministically.
  member:
    semantics: partial
    semantics_explanation: Declared member and callable types, static calls, and assigned values are preserved
      without resolving dynamic types or runtime mutation.
    inventory: supported
    inventory_explanation: Every supported static member, callable type, call, and assigned-value fact in included
      Python sources is emitted deterministically.
  dependency:
    semantics: supported
    semantics_explanation: Authored import dependencies are normalized with explicit resolved, external, or
      unresolved state; dynamic loading is excluded.
    inventory: supported
    inventory_explanation: Every authored import declaration in included Python sources is emitted
      deterministically.
scenarios:
- name: supported-contract
  fixture: extensions
  source: src/example_shapes.py
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: source, relative_path: src/example_shapes.py}
  - kind: capability
    capability: symbols
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: ExampleContract, declaration_kind: abstract_class}
  - kind: capability
    capability: callables
    evidence: supported
    state: present
    observation: {kind: callable, qualified_name: example_factory, callable_kind: function}
  - kind: capability
    capability: calls
    evidence: supported
    state: present
    observation: {kind: call, owner: ExampleImplementation.example_path, target: self.example_required, resolution:
        resolved}
  - kind: capability
    capability: assigned_values
    evidence: supported
    state: present
    observation:
      kind: assigned_values
      owner: ExampleAssignedValues
  - kind: capability
    capability: declaration_kinds
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: ExampleImplementation, declaration_kind: class}
  - kind: capability
    capability: dependencies
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/example_shapes.py, target: abc, resolution: external}
  - kind: relationship
    relationship: declaration
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleImplementation, relation: extends, target:
        ExampleContract}
  - kind: relationship
    relationship: member
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: attribute, owner: ExampleContract, name: example_shared, member_kind: instance}
  - kind: relationship
    relationship: dependency
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/example_shapes.py, target: abc, resolution: external}
  - kind: relationship
    relationship: dependency
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/example_shapes.py, target: abc, resolution: external}
  - kind: capability
    capability: modifiers
    evidence: supported
    state: present
    observation: {kind: modifier, owner: ExampleImplementation.example_static, visibility: public}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleImplementation, relation: extends, target:
        ExampleContract}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: call, owner: ExampleImplementation.example_path, target: self.example_required, resolution:
        resolved}
- name: empty-source
  fixture: types
  source: src/type_reference_empty.py
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: empty_source, relative_path: src/type_reference_empty.py}
- name: annotation-evaluation-boundary
