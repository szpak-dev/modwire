    evidence: supported
    state: present
    observation: {kind: annotation, owner: ExampleBase, expression: example_annotation}
  - kind: capability
    capability: annotations
    evidence: boundary
    state: absent
    observation: {kind: annotation, owner: ExampleBase, expression: example_runtime_annotation}
- name: modifier-normalization-boundary
  fixture: gaps
