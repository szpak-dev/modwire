language: python
runtime:
  runtime: python
  probe:
    arguments: [--version]
    pattern: ^Python (\d+\.\d+\.\d+)
  version:
    major: 3
    minor: 14
    patch: 2
  rejected_versions: []
  packages: []
fixtures:
  source_suffixes:
  - .py
  extensions:
    root: tests/fixtures/code_map/language_extensions/python
    sources:
    - src/example_shapes.py
  gaps:
    root: tests/fixtures/code_map/capability_gaps/python
    sources:
    - src/example_package/__init__.py
  types:
    root: tests/fixtures/code_map/type_references/python
    sources:
    - src/type_reference_cases.py
    - src/type_reference_empty.py
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/python
    sources:
    - src/params.py
  structural:
    root: tests/fixtures/structural_fidelity
    sources:
    - python/src/example.py
capabilities:
  sources:
    status: supported
  symbols:
    status: supported
  callables:
    status: supported
  calls:
    status: supported
  parameters:
    status: supported
  type_references:
    status: partial
  annotations:
    status: partial
  modifiers:
    status: partial
  attributes:
    status: supported
  assigned_values:
    status: supported
  inheritance:
    status: supported
  namespaces:
    status: unsupported
  declaration_kinds:
    status: supported
  composition:
    status: unsupported
  dependencies:
    status: supported
  spans:
    status: partial
relationships:
  declaration:
    semantics: partial
    inventory: supported
  member:
    semantics: partial
    inventory: supported
  dependency:
    semantics: supported
    inventory: supported
scenarios:
- name: supported-contract
  fixture: extensions
  source: src/example_shapes.py
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: source, relative_path: src/example_shapes.py}
  - kind: capability
    capability: symbols
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: ExampleContract, declaration_kind: abstract_class}
  - kind: capability
    capability: callables
    evidence: supported
    state: present
    observation: {kind: callable, qualified_name: example_factory, callable_kind: function}
  - kind: capability
    capability: calls
    evidence: supported
    state: present
    observation: {kind: call, owner: ExampleImplementation.example_path, target: self.example_required,
        resolution: resolved}
  - kind: capability
    capability: assigned_values
    evidence: supported
    state: present
    observation:
      kind: assigned_values
      owner: ExampleAssignedValues
  - kind: capability
    capability: declaration_kinds
    evidence: supported
    state: present
    observation: {kind: declaration, qualified_name: ExampleImplementation, declaration_kind: class}
  - kind: capability
    capability: dependencies
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/example_shapes.py, target: abc, resolution: external}
  - kind: relationship
    relationship: declaration
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleImplementation, relation: extends, target:
        ExampleContract}
  - kind: relationship
    relationship: member
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: attribute, owner: ExampleContract, name: example_shared, member_kind: instance}
  - kind: relationship
    relationship: dependency
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/example_shapes.py, target: abc, resolution: external}
  - kind: relationship
    relationship: dependency
    aspect: inventory
    evidence: supported
    state: present
    observation: {kind: dependency, source: src/example_shapes.py, target: abc, resolution: external}
  - kind: capability
    capability: modifiers
    evidence: supported
    state: present
    observation: {kind: modifier, owner: ExampleImplementation.example_static, visibility: public}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleImplementation, relation: extends, target:
        ExampleContract}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: supported
    state: present
    observation: {kind: call, owner: ExampleImplementation.example_path, target: self.example_required,
        resolution: resolved}
- name: empty-source
  fixture: types
  source: src/type_reference_empty.py
  claims:
  - kind: capability
    capability: sources
    evidence: supported
    state: present
    observation: {kind: empty_source, relative_path: src/type_reference_empty.py}
- name: annotation-evaluation-boundary
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: annotations
    evidence: supported
    state: present
    observation: {kind: annotation, owner: ExampleBase, expression: example_annotation}
  - kind: capability
    capability: annotations
    evidence: boundary
    state: absent
    observation: {kind: annotation, owner: ExampleBase, expression: example_runtime_annotation}
- name: modifier-normalization-boundary
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: modifiers
    evidence: boundary
    state: present
    observation: {kind: modifier, owner: ExampleBase, visibility: public}
- name: package-namespace
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: namespaces
    evidence: boundary
    state: absent
    observation: {kind: namespace, qualified_name: example_package, namespace_kind: package}
- name: no-distinct-composition-syntax
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: composition
    evidence: boundary
    state: present
    observation: {kind: declaration_relation, source: ExampleRuntime, relation: extends, target: ExampleAlias}
- name: non-callable-span-boundary
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: spans
    evidence: supported
    state: present
    observation: {kind: exact_span, owner: example_annotation, start: 6, end: 8}
  - kind: capability
    capability: spans
    evidence: boundary
    state: absent
    observation: {kind: span_owner, owner: ExampleBase}
- name: declaration-runtime-semantics-boundary
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: inheritance
    evidence: supported
    state: present
    observation: {kind: declaration_relation, source: ExampleRuntime, relation: extends, target: ExampleAlias}
  - kind: capability
    capability: inheritance
    evidence: boundary
    state: absent
    observation: {kind: declaration_relation, source: ExampleRuntime, relation: extends, target: ExampleBase}
  - kind: relationship
    relationship: declaration
    aspect: semantics
    evidence: boundary
    state: present
    observation: {kind: declaration_relation, source: ExampleRuntime, relation: extends, target: ExampleAlias}
- name: member-runtime-semantics-boundary
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: attributes
    evidence: supported
    state: present
    observation: {kind: attribute, owner: ExampleBase, name: example_value, member_kind: instance}
  - kind: capability
    capability: attributes
    evidence: boundary
    state: absent
    observation: {kind: attribute, owner: ExampleBase, name: example_runtime_member, member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: boundary
    state: present
    observation: {kind: attribute, owner: ExampleBase, name: example_value, member_kind: instance}
- name: type-reference-grammar-boundary
  fixture: types
  source: src/type_reference_cases.py
  claims:
  - kind: capability
    capability: type_references
    evidence: supported
    state: present
    observation:
      kind: type_reference
      owner: example_types
      role: return
      position: 0
  - kind: capability
    capability: type_references
    evidence: boundary
    state: unsupported
    observation: {kind: type_slot, owner: example_types, role: parameter, position: 1}
  - kind: capability
    capability: type_references
    evidence: boundary
    state: absent
    observation: {kind: type_slot, owner: example_types, role: parameter, position: 2}
- name: parameter-kinds
  fixture: parameters
  source: src/params.py
  claims:
  - kind: capability
    capability: parameters
    evidence: supported
    state: present
    observation:
      kind: parameter_list
      owner: example_parameters
manifests:
  root: tests/fixtures/implementation_manifest/python
  scenarios:
  - name: canonical
    source: canonical/src/example.py
    facts_digest: dd487dd4d0be1d5bb2abaefa73b7f2049f47047d2b2f37e0de9646f81d88afab
    claims:
    - state: present
      observation: {kind: source, relative_path: src/example.py}
    - state: present
      observation: {kind: symbol, qualified_name: src/example.ExampleContract, symbol_kind: abstract_class}
    - state: present
      observation: {kind: callable, qualified_name: ExampleImplementation.__init__, callable_kind: constructor}
    - state: present
      observation: {kind: parameter, owner: example_async, position: 0}
    - state: present
      observation: {kind: attribute, owner: ExampleContract, name: example_shared, member_kind: instance}
    - state: present
      observation: {kind: call, owner: ExampleImplementation.example_path, target: self.example_required,
          resolution: resolved}
    - state: present
      observation: {kind: declaration_relation, source: ExampleContract, relation: extends, target: ABC}
    - state: present
      observation: {kind: dependency, source: src/example.py, target: abc, resolution: external}
  - name: calls
    source: calls/src/example.py
    facts_digest: d9723be546df4daf6d46a2b5297cac0badb74bff34617da7fb34f97e869b2355
    claims:
    - state: present
      observation: {kind: source, relative_path: src/example.py}
    - state: present
      observation: {kind: call, owner: example_source, target: example_target, resolution: resolved}
  - name: no_calls
    source: no_calls/src/example.py
    facts_digest: baaccc9596aa92ced1961c7a78c061626746e014ca00964f6f0ef01574544ce4
    claims:
    - state: present
      observation: {kind: source, relative_path: src/example.py}
    - state: absent
      observation: {kind: call, owner: example_source, target: example_target, resolution: resolved}
  - name: negative_members
    source: negative_members/src/example.py
    facts_digest: d349aa936a7774b92d8771f402abfdcc86ea68d93d7f662f8fd4468275566636
    claims:
    - state: present
      observation: {kind: source, relative_path: src/example.py}
    - state: absent
      observation: {kind: symbol, qualified_name: src/example.ExampleContract, symbol_kind: abstract_class}
  - name: dependencies
    source: dependencies/src/example.py
    facts_digest: af6fa28ce97e73180952f673094afdc41cd8aa23f8cc713c3aacdea47a4a6bc2
    claims:
    - state: present
      observation: {kind: source, relative_path: src/example.py}
    - state: present
      observation: {kind: dependency, source: src/example.py, target: json, resolution: external}
  - name: source_edit_before
    source: source_edit_before/src/nested/example.py
    facts_digest: 604776fefbacc63e85c91133c8786f3e021ad7fdd1d70ea305c67d6c0e21f71a
    claims:
    - state: present
      observation: {kind: source, relative_path: src/nested/example.py}
  - name: source_edit_after
    source: source_edit_after/src/example.py
    facts_digest: b54746739abbbbfe67e2ca4bb5f99fe75acf71c3aeb70e9dfedf2872efdb2dca
    claims:
    - state: present
      observation: {kind: source, relative_path: src/example.py}
  transitions:
  - before: source_edit_before
    after: source_edit_after
    changes:
    - source_identity
    - implementation_identity
