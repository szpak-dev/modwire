language: python
runtime:
  runtime: python
  executable: python
  version:
    major: 3
    minor: 12
    patch: 11
  packages: []
fixtures:
  source_suffixes:
    - .py
  extensions:
    root: tests/fixtures/code_map/language_extensions/python
    sources:
      - src/example_shapes.py
  gaps:
    root: tests/fixtures/code_map/capability_gaps/python
    sources:
      - src/example_package/__init__.py
  types:
    root: tests/fixtures/code_map/type_references/python
    sources:
      - src/type_reference_cases.py
      - src/type_reference_empty.py
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/python
    sources:
      - src/params.py
capabilities:
  sources:
    status: supported
    explanation: Every included Python source is identified and hashed.
  symbols:
    status: supported
    explanation: Classes, abstract classes, functions, and values are extracted.
  callables:
    status: supported
    explanation: Functions, methods, constructors, and lambdas are extracted.
  calls:
    status: supported
    explanation: Static calls owned by extracted callables are emitted with explicit resolved, 
      external, unresolved, or dynamic state.
  parameters:
    status: supported
    explanation: Callable parameter order, kind, annotation, and default presence are extracted.
  type_references:
    status: partial
    explanation: Named references and ordered generic arguments are structural; other authored type 
      syntax is reported as unsupported.
  annotations:
    status: partial
    explanation: Class and callable decorators and declared type annotations are extracted; 
      arbitrary annotations are not evaluated.
  modifiers:
    status: partial
    explanation: Visibility intent, callable kind, and class property member kind are normalized.
  attributes:
    status: supported
    explanation: Class property identity, exact declared type, visibility, optionality, and member 
      kind are extracted.
  assigned_values:
    status: supported
    explanation: Ordered assignment evidence distinguishes calls, references, literals, unresolved 
      expressions, and declarations without an assigned value.
  inheritance:
    status: supported
    explanation: Every declared Python base expression is recorded.
  namespaces:
    status: unsupported
    explanation: Python namespace declarations are not extracted yet.
  declaration_kinds:
    status: supported
    explanation: Classes and abstract classes publish exact shared declaration kinds.
  composition:
    status: unsupported
    explanation: Python base expressions are reported as inheritance; no distinct composition 
      relation syntax is classified.
  dependencies:
    status: supported
    explanation: Imports are normalized and resolved when targets are present.
  spans:
    status: partial
    explanation: Callable spans are exact; other symbol facts expose line counts.
relationships:
  declaration:
    semantics: partial
    semantics_explanation: Authored base expressions are preserved without interpreting runtime 
      rebinding, metaclasses, or framework conventions.
    inventory: supported
    inventory_explanation: Every authored class base expression in included Python sources is 
      emitted deterministically.
  member:
    semantics: partial
    semantics_explanation: Declared member and callable types, static calls, and assigned values are
      preserved without resolving dynamic types or runtime mutation.
    inventory: supported
    inventory_explanation: Every supported static member, callable type, call, and assigned-value 
      fact in included Python sources is emitted deterministically.
  dependency:
    semantics: supported
    semantics_explanation: Authored import dependencies are normalized with explicit resolved, 
      external, or unresolved state; dynamic loading is excluded.
    inventory: supported
    inventory_explanation: Every authored import declaration in included Python sources is emitted 
      deterministically.
scenarios:
  - name: supported-contract
    fixture: extensions
    source: src/example_shapes.py
    claims:
      - kind: capability
        capability: sources
        state: present
        observation:
          kind: source
          relative_path: src/example_shapes.py
      - kind: capability
        capability: symbols
        state: present
        observation:
          kind: declaration
          qualified_name: ExampleContract
          declaration_kind: abstract_class
      - kind: capability
        capability: callables
        state: present
        observation:
          kind: callable
          qualified_name: example_factory
          callable_kind: function
      - kind: capability
        capability: calls
        state: present
        observation:
          kind: call
          owner: ExampleImplementation.example_path
          target: self.example_required
          resolution: resolved
      - kind: capability
        capability: assigned_values
        state: present
        observation:
          kind: assigned_values
          owner: ExampleAssignedValues
          attributes:
            - name: example_unassigned
              values:
                - kind: unassigned
                  expression: ""
                  reference: ""
            - name: example_literal
              values:
                - kind: literal
                  expression: "1"
                  reference: ""
            - name: example_reference
              values:
                - kind: reference
                  expression: EXAMPLE_REFERENCE
                  reference: EXAMPLE_REFERENCE
                - kind: reference
                  expression: example_input
                  reference: example_input
            - name: example_call
              values:
                - kind: call
                  expression: example_factory()
                  reference: example_factory
            - name: example_unresolved
              values:
                - kind: unresolved
                  expression: 1 + 2
                  reference: ""
            - name: example_nested
              values:
                - kind: literal
                  expression: "1"
                  reference: ""
                - kind: literal
                  expression: "2"
                  reference: ""
      - kind: capability
        capability: declaration_kinds
        state: present
        observation:
          kind: declaration
          qualified_name: ExampleImplementation
          declaration_kind: class
      - kind: capability
        capability: dependencies
        state: present
        observation:
          kind: dependency
          source: src/example_shapes.py
          target: abc
          resolution: external
      - kind: relationship
        relationship: declaration
        aspect: inventory
        state: present
        observation:
          kind: declaration_relation
          source: ExampleImplementation
          relation: extends
          target: ExampleContract
      - kind: relationship
        relationship: member
        aspect: inventory
        state: present
        observation:
          kind: attribute
          owner: ExampleContract
          name: example_shared
          member_kind: instance
      - kind: relationship
        relationship: dependency
        aspect: semantics
        state: present
        observation:
          kind: dependency
          source: src/example_shapes.py
          target: abc
          resolution: external
      - kind: relationship
        relationship: dependency
        aspect: inventory
        state: present
        observation:
          kind: dependency
          source: src/example_shapes.py
          target: abc
          resolution: external
  - name: empty-source
    fixture: types
    source: src/type_reference_empty.py
    claims:
      - kind: capability
        capability: sources
        state: present
        observation:
          kind: empty_source
          relative_path: src/type_reference_empty.py
  - name: annotation-evaluation-boundary
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: annotations
        state: present
        observation:
          kind: annotation
          owner: ExampleBase
          expression: example_annotation
      - kind: capability
        capability: annotations
        state: absent
        observation:
          kind: annotation
          owner: ExampleBase
          expression: example_runtime_annotation
  - name: modifier-normalization-boundary
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: modifiers
        state: absent
        observation:
          kind: modifier
          owner: ExampleBase
          modifier: final
  - name: package-namespace
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: namespaces
        state: absent
        observation:
          kind: namespace
          qualified_name: example_package
          namespace_kind: package
  - name: no-distinct-composition-syntax
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: composition
        state: present
        observation:
          kind: declaration_relation
          source: ExampleRuntime
          relation: extends
          target: ExampleAlias
  - name: non-callable-span-boundary
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: spans
        state: present
        observation:
          kind: exact_span
          owner: example_annotation
          start: 6
          end: 8
      - kind: capability
        capability: spans
        state: absent
        observation:
          kind: span_owner
          owner: ExampleBase
  - name: declaration-runtime-semantics-boundary
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: inheritance
        state: present
        observation:
          kind: declaration_relation
          source: ExampleRuntime
          relation: extends
          target: ExampleAlias
      - kind: capability
        capability: inheritance
        state: absent
        observation:
          kind: declaration_relation
          source: ExampleRuntime
          relation: extends
          target: ExampleBase
      - kind: relationship
        relationship: declaration
        aspect: semantics
        state: present
        observation:
          kind: declaration_relation
          source: ExampleRuntime
          relation: extends
          target: ExampleAlias
  - name: member-runtime-semantics-boundary
    fixture: gaps
    source: src/example_package/__init__.py
    claims:
      - kind: capability
        capability: attributes
        state: present
        observation:
          kind: attribute
          owner: ExampleBase
          name: example_value
          member_kind: instance
      - kind: capability
        capability: attributes
        state: absent
        observation:
          kind: attribute
          owner: ExampleBase
          name: example_runtime_member
          member_kind: instance
      - kind: relationship
        relationship: member
        aspect: semantics
        state: present
        observation:
          kind: attribute
          owner: ExampleBase
          name: example_value
          member_kind: instance
  - name: type-reference-grammar-boundary
    fixture: types
    source: src/type_reference_cases.py
    claims:
      - kind: capability
        capability: type_references
        state: present
        observation:
          kind: type_reference
          owner: example_types
          role: return
          position: 0
          type:
            kind: reference
            name: dict
            arguments:
              - kind: reference
                name: str
                arguments: []
              - kind: reference
                name: list
                arguments:
                  - kind: reference
                    name: int
                    arguments: []
      - kind: capability
        capability: type_references
        state: unsupported
        observation:
          kind: type_slot
          owner: example_types
          role: parameter
          position: 1
      - kind: capability
        capability: type_references
        state: absent
        observation:
          kind: type_slot
          owner: example_types
          role: parameter
          position: 2
  - name: parameter-kinds
    fixture: parameters
    source: src/params.py
    claims:
      - kind: capability
        capability: parameters
        state: present
        observation:
          kind: parameter_kinds
          present:
            - positional
            - variadic_positional
            - named_only
            - variadic_named
manifests:
  root: tests/fixtures/implementation_manifest/python
  scenarios:
    - name: canonical
      source: canonical/src/example.py
      digest: ea7f5a8de25f1e9d4778a5052f2539744da0e370de1e2a9ef9c9b9650d0b9dde
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
        - state: present
          observation:
            kind: symbol
            qualified_name: src/example.ExampleContract
            symbol_kind: abstract_class
        - state: present
          observation:
            kind: callable
            qualified_name: ExampleImplementation.__init__
            callable_kind: constructor
        - state: present
          observation:
            kind: parameter
            owner: example_async
            name: example_value
            position: 0
            parameter_kind: positional
            has_default: false
        - state: present
          observation:
            kind: attribute
            owner: ExampleContract
            name: example_shared
            member_kind: instance
        - state: present
          observation:
            kind: call
            owner: ExampleImplementation.example_path
            target: self.example_required
            resolution: resolved
        - state: present
          observation:
            kind: declaration_relation
            source: ExampleContract
            relation: extends
            target: ABC
        - state: present
          observation:
            kind: dependency
            source: src/example.py
            target: abc
            resolution: external
    - name: calls
      source: calls/src/example.py
      digest: 27c621f8479ede0864093680e9f30382cae342da61671bd5cec290357c29683d
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
        - state: present
          observation:
            kind: call
            owner: example_source
            target: example_target
            resolution: resolved
    - name: no_calls
      source: no_calls/src/example.py
      digest: d27846b74358bd1fb568fd2d8cfafc007467fe0b6a8e1b6a4dbd64180c528ef1
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
        - state: absent
          observation:
            kind: call
            owner: example_source
            target: example_target
            resolution: resolved
    - name: negative_members
      source: negative_members/src/example.py
      digest: acf0c9c7fbac6a43fd2b887c9db85cf198021c71c4dc279bfaae304886b07ab4
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
        - state: absent
          observation:
            kind: symbol
            qualified_name: src/example.ExampleContract
            symbol_kind: abstract_class
    - name: dependencies
      source: dependencies/src/example.py
      digest: 8012b12abe368fcb855e8e475b92401a6d457a146497880b0bf4911f248f3a37
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
        - state: present
          observation:
            kind: dependency
            source: src/example.py
            target: json
            resolution: external
    - name: source_edit_before
      source: source_edit_before/src/example.py
      digest: 94cdc164369738b4ebe5f5e2628cea822ed80e23a093b9feda34378143c9ee67
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
    - name: source_edit_after
      source: source_edit_after/src/example.py
      digest: eb95d3967567ac1b9c4ae1eb29b0f756b231a71526208a9d7146c1cbc83e67b0
      claims:
        - state: present
          observation:
            kind: source
            relative_path: src/example.py
  transitions:
