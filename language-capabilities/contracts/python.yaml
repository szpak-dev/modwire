  claims:
  - kind: capability
    capability: modifiers
    evidence: boundary
    state: present
    observation: {kind: modifier, owner: ExampleBase, visibility: public}
- name: package-namespace
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: namespaces
    evidence: boundary
    state: absent
    observation: {kind: namespace, qualified_name: example_package, namespace_kind: package}
- name: no-distinct-composition-syntax
  fixture: gaps
  source: src/example_package/__init__.py
  claims:
  - kind: capability
    capability: composition
    evidence: boundary
    state: present
    observation: {kind: declaration_relation, source: ExampleRuntime, relation: extends, target: ExampleAlias}
