  - kind: capability
    capability: attributes
    evidence: boundary
    state: absent
    observation: {kind: attribute, owner: ExampleBase, name: example_runtime_member, member_kind: instance}
  - kind: relationship
    relationship: member
    aspect: semantics
    evidence: boundary
    state: present
    observation: {kind: attribute, owner: ExampleBase, name: example_value, member_kind: instance}
- name: type-reference-grammar-boundary
  fixture: types
  source: src/type_reference_cases.py
  claims:
  - kind: capability
    capability: type_references
    evidence: supported
    state: present
    observation:
      kind: type_reference
      owner: example_types
      role: return
      position: 0
  - kind: capability
    capability: type_references
    evidence: boundary
    state: unsupported
    observation: {kind: type_slot, owner: example_types, role: parameter, position: 1}
  - kind: capability
    capability: type_references
    evidence: boundary
    state: absent
    observation: {kind: type_slot, owner: example_types, role: parameter, position: 2}
- name: parameter-kinds
