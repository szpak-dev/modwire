language: typescript
runtime:
  runtime: node
  probe:
    arguments: [--version]
    pattern: ^v(\d+\.\d+\.\d+)
  version:
    major: 24
    minor: 2
    patch: 0
  packages: []
fixtures:
  source_suffixes:
  - .ts
  - .tsx
  - .js
  - .jsx
  extensions:
    root: tests/fixtures/code_map/language_extensions/typescript
    sources:
    - src/example-audit.js
    - src/example-panel.jsx
    - src/example-shapes.ts
    - src/example-view.tsx
  gaps:
    root: tests/fixtures/code_map/capability_gaps/typescript
    sources:
    - src/example-capability-gaps.ts
  types:
    root: tests/fixtures/code_map/type_references/typescript
    sources:
    - src/type-reference-cases.ts
    - src/type-reference-empty.ts
  parameters:
    root: tests/fixtures/code_map/parameter_kinds/typescript
    sources:
    - src/params.ts
  structural:
    root: tests/fixtures/structural_fidelity
    sources:
    - typescript/src/example.ts
    - typescript_payloads/src/example.ts
capabilities:
  sources:
    status: supported
  symbols:
    status: supported
  callables:
    status: supported
  calls:
    status: supported
  parameters:
    status: supported
  type_references:
    status: partial
  annotations:
    status: partial
  modifiers:
    status: partial
  attributes:
    status: supported
  assigned_values:
    status: unsupported
  inheritance:
    status: supported
  namespaces:
    status: unsupported
  declaration_kinds:
    status: supported
  composition:
    status: partial
  dependencies:
    status: supported
  spans:
    status: partial
relationships:
  declaration:
    semantics: partial
    inventory: supported
  member:
    semantics: partial
    inventory: partial
  dependency:
    semantics: supported
    inventory: supported
