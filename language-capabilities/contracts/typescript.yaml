            ExampleFirst}
  - name: non-callable-span-boundary
    fixture: gaps
    source: src/example-capability-gaps.ts
    claims:
      - kind: capability
        capability: spans
        evidence: boundary
        state: absent
        observation: {kind: span_owner, owner: ExampleAssignedValue}
  - name: declaration-runtime-semantics-boundary
    fixture: gaps
    source: src/example-capability-gaps.ts
    claims:
