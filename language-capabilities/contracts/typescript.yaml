  - name: type-reference-grammar-boundary
    fixture: types
    source: src/type-reference-cases.ts
    claims:
      - kind: capability
        capability: type_references
        evidence: supported
        state: present
        observation:
          kind: type_reference
          owner: exampleTypes
          role: return
          position: 0
          type:
            kind: reference
            name: Map
            arguments:
              - kind: reference
                name: string
                arguments: []
              - kind: reference
                name: Array
                arguments:
                  - kind: reference
                    name: number
                    arguments: []
      - kind: capability
        capability: type_references
        evidence: boundary
        state: unsupported
        observation: {kind: type_slot, owner: exampleTypes, role: parameter, position: 1}
      - kind: capability
        capability: type_references
        evidence: boundary
        state: absent
        observation: {kind: type_slot, owner: exampleTypes, role: parameter, position: 2}
  - name: parameter-kinds
    fixture: parameters
    source: src/params.ts
    claims:
      - kind: capability
        capability: parameters
        evidence: supported
        state: present
        observation: {kind: parameter_kinds, present: [positional, variadic_positional]}
  - name: javascript-function
    fixture: extensions
    source: src/example-audit.js
    claims:
      - kind: capability
