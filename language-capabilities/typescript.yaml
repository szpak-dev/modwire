scenarios:
  - scenario: non-class-decorator-boundary
    rationale: Class decorators are emitted while method decorators remain absent.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - '@ExampleClassDecorator'
      - '@ExampleMethodDecorator'
  - scenario: modifier-normalization-boundary
    rationale: Readonly syntax is authored without a fabricated shared visibility value.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - readonly exampleValue
  - scenario: assigned-value
    rationale: Authored property initializers emit attributes without assigned-value evidence.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - exampleValue =
  - scenario: namespace-declaration
    rationale: Authored namespace syntax is scanned but no namespace fact is emitted.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - ExampleNamespace
  - scenario: heritage-only-composition-boundary
    rationale: Implementation heritage is emitted while type-intersection composition is not.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - implements ExampleFirst
      - ExampleFirst & ExampleSecond
  - scenario: non-callable-span-boundary
    rationale: Callable spans are exact while class declarations have no exact-span identity.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - class ExampleAssignedValue
  - scenario: declaration-runtime-semantics-boundary
    rationale: The authored runtime-base alias is retained without resolving its runtime target.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - ExampleRuntimeBase = ExampleAssignedValue
  - scenario: member-runtime-semantics-boundary
    rationale: Prototype mutation does not fabricate a declared class attribute.
    source: tests/fixtures/code_map/capability_gaps/typescript/src/example-capability-gaps.ts
    authored_syntax:
      - exampleRuntimeMember
  - scenario: type-reference-grammar-boundary
    rationale: Named generic references are structural while union syntax is explicitly unsupported.
    source: tests/fixtures/code_map/type_references/typescript/src/type-reference-cases.ts
    authored_syntax:
      - Array<string>
      - string | undefined
